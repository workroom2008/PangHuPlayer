name: panghu_player
description: PangHuPlayer - A beautiful media player with Emby/Jellyfin/MoviePilot support
publish_to: 'none'
version: 0.135.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  dio: ^5.4.0
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  flutter_animate: ^4.3.0
  go_router: ^13.0.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  # media_kit — MPV 高性能播放内核 (libmpv, 支持杜比视界/HDR)
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  # ExoPlayer 内核 (通过 video_player，Android 原生)
  video_player: ^2.11.1
  chewie: ^1.7.4
  # Android 播放增强
  wakelock_plus: ^1.2.8
  screen_brightness: ^0.2.2
  volume_controller: ^2.0.7
  audio_service: ^0.18.15
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  easy_refresh: ^3.3.4
  flutter_screenutil: ^5.9.0
  iconsax: ^0.0.8
  lottie: ^3.0.0
  flutter_svg: ^2.0.9
  webview_flutter: ^4.4.2
  url_launcher: ^6.2.2
  path_provider: ^2.1.2
  permission_handler: ^11.2.0
  uuid: ^4.3.1
  intl: ^0.19.0
  logger: ^2.0.2
  collection: ^1.18.0
  table_calendar: ^3.1.0
  flutter_slidable: ^3.1.1
  palette_generator: ^0.3.3+7
  crypto: ^3.0.3
  file_picker: ^8.0.0
  # 纯 Dart GBK/GB18030 解码（中文字幕编码支持）
  fast_gbk: ^1.0.0
  # drift SQLite 本地数据库
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  # TV 端二维码扫码配置（仅在 TV 入口使用）
  qr_flutter: ^4.1.0
  # TV 端获取局域网 IP（用于显示扫码 URL）
  network_info_plus: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
